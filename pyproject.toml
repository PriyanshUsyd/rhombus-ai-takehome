[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rhombus-ai-takehome"
version = "0.1.0"
description = "QA and observability tests for a Rhombus AI scheduled pipeline (Azure Blob -> Azure Blob)"
requires-python = ">=3.11"
dependencies = [
    "pytest==9.1.1",
    "pytest-playwright==0.9.0",
    "requests==2.34.2",
    "pandas==3.0.6",
    "azure-storage-blob==12.31.0",
    "python-dotenv==1.2.4",
    "ruff==0.16.10",
]

[tool.setuptools]
# Test/script repo, not an importable package.
packages = []

[tool.pytest.ini_options]
testpaths = ["ui-tests", "api-tests", "data-validation", "scripts"]
pythonpath = ["scripts", "data-validation"]
markers = [
    "live: hits the real Rhombus app or cloud buckets (opt-in: pytest -m live)",
    "run_pipeline: runs the real pipeline once (opt-in: --run-pipeline, UI tests only)",
]
# pytest-playwright: keep traces/screenshots only for failing tests (test-results/ is gitignored).
addopts = "--tracing=retain-on-failure --screenshot=only-on-failure --output=test-results"

[tool.ruff]
line-length = 100
target-version = "py311"
